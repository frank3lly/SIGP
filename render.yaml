services:
  - type: web
    name: parqueame-web
    runtime: static
    buildCommand: cd app && npm install && npm run build
    staticPublishPath: app/dist
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: parqueame-api
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PARQUEAME_TEST_MODE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: PARQUEAME_ADMIN_PASSWORD
        sync: false
